[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buidl"
version = "2.0.0"
description = "Desktop GUI and Android downloader for media linked in XenForo forum threads."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "sujirobase-ctrl" }]
keywords = ["xenforo", "forum", "downloader", "media", "simpcity"]
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "customtkinter>=5.2.2,<6",
    "Pillow>=10,<13",
    "av>=16,<18",
    "pywebview>=6.2,<7",
]

[project.urls]
Homepage = "https://github.com/sujirobase-ctrl/gigavader"

[project.scripts]
buidl-desktop = "desktop:main"

[tool.setuptools]
py-modules = ["downloader", "main", "gui", "desktop"]
packages = [
    "src",
    "src.downloaders",
    "src.parsers",
    "src.managers",
    "desktop_ui",
]

[tool.setuptools.package-data]
src = ["py.typed"]
desktop_ui = ["*.html", "*.js", "*.ico", "*.png"]

# Build and test BUIDL
name: Build and test BUIDL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Qt test libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run offline tests
        run: python -m pytest tests --ignore=tests/test_e2e.py --ignore=tests/test_mobile_bridge.py -q
      - name: Run Android Python bridge tests in isolation
        run: python -m pytest tests/test_mobile_bridge.py -q
      - name: Run local end-to-end tests
        run: python -m tests.test_e2e

  windows:
    name: Windows desktop GUI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Build desktop GUI
        run: pyinstaller --clean --noconfirm buidl-desktop.spec
      - name: Verify packaged GoFile parser
        run: python tests/packaged_gofile_smoke.py dist/BUIDL-2.0.0-Teste.exe
      - name: Verify packaged TLS runtime
        run: python tests/packaged_https_smoke.py dist/BUIDL-2.0.0-Teste.exe
      - name: Exercise the packaged Windows interface
        run: python tests/desktop_gui_e2e.py dist/BUIDL-2.0.0-Teste.exe
      - name: Test Windows cookie capture and protected storage
        run: |
          python -m pytest tests/test_browser_session.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/windows_login_e2e.py dist/BUIDL-2.0.0-Teste.exe
      - name: Collect GUI artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/BUIDL-2.0.0-Teste.exe release/BUIDL-2.0.0-Teste.exe
      - uses: actions/upload-artifact@v4
        with:
          name: BUIDL-Windows-GUI
          path: release/BUIDL-2.0.0-Teste.exe
          if-no-files-found: error

  android:
    if: github.event_name == 'workflow_dispatch'
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build Android APK
        working-directory: android
        env:
          CHAQUOPY_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Build Android recovery tests
        working-directory: android
        env:
          CHAQUOPY_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: ./gradlew :app:assembleQa :app:assembleQaAndroidTest -Pqa --no-daemon --stacktrace
      - name: Install QA server dependencies
        run: python -m pip install -r requirements.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test download recovery on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: bash android/run-recovery-qa.sh
      - name: Collect APK artifact
        run: |
          mkdir release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/BUIDL-2.0.0-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BUIDL-Android-APK
          path: release/BUIDL-2.0.0-Android.apk
          if-no-files-found: error
